# ATHEX Orb — ρυθμίσεις
# Όλα τα ποσοστά είναι σε δεκαδική μορφή (0.001 = 0,1%).

[data]
source = "yahoo"            # "yahoo" (μέσω yfinance) ή "csv" (αρχεία στο data/csv/<TICKER>.csv)
history_years = 8           # πόσα χρόνια ιστορικού κατεβάζουμε
index_ticker = "GD.AT"      # Γενικός Δείκτης ΧΑ στο Yahoo· αν λείπει, φτιάχνεται ισοσταθμικός δείκτης

[barriers]
# Τα 3 σενάρια (όπως το "Orb"): στόχος πρώτα / stop πρώτα / τίποτα μέσα στον χρόνο
k_tp = 2.0                  # στόχος = είσοδος × (1 + k_tp × ATR/τιμή)
k_sl = 1.0                  # stop   = είσοδος × (1 − k_sl × ATR/τιμή)
horizon_days = 10           # μέγιστη διάρκεια θέσης σε ημέρες συναλλαγών
atr_days = 14

[model]
kind = "logreg"             # "logreg" (σταθερό, εξηγήσιμο) ή "hgb" (gradient boosting)
min_train_days = 500        # ελάχιστο ιστορικό πριν την πρώτη πρόβλεψη
retrain_every_days = 21     # επανεκπαίδευση κάθε ~1 μήνα (walk-forward)
train_window_days = 1500    # κυλιόμενο παράθυρο εκπαίδευσης (0 = όλο το ιστορικό)

[costs]
commission_pct = 0.0010     # προμήθεια χρηματιστή ανά πλευρά
commission_min_eur = 5.0    # ελάχιστη προμήθεια ανά εντολή
exchange_fees_pct = 0.0003  # χρεώσεις ΧΑ/ΕΛ.Κ.Α.Τ. ανά πλευρά (κατά προσέγγιση)
sell_tax_pct = 0.0          # φόρος πώλησης — ελέγξτε την ισχύουσα νομοθεσία
spread_bps_base = 10        # μισό spread για μετοχή με πολύ υψηλή ρευστότητα (bps ανά πλευρά)
impact_coef = 0.10          # επίδραση στην τιμή: coef × sqrt(εντολή / μέσος τζίρος)

[portfolio]
capital_eur = 10000
position_eur_max = 2000     # μέγιστο ποσό ανά θέση
max_positions = 5
max_per_sector = 2
max_adv_fraction = 0.01     # η θέση ≤ 1% του μέσου ημερήσιου τζίρου 20 ημερών

[guard]
min_adv_eur = 300000        # ελάχιστος μέσος ημερήσιος τζίρος (20 ημ.)
min_price_eur = 0.50
max_atr_pct = 0.08          # αποκλεισμός αν ATR/τιμή > 8%
min_history_days = 260
crash_index_drop = 0.08     # παύση νέων θέσεων αν ο δείκτης έπεσε >8% σε 10 ημέρες
min_ev_net = 0.003          # ελάχιστη αναμενόμενη καθαρή απόδοση ανά συναλλαγή (0,3%)
min_p_tp = 0.0              # προαιρετικό ελάχιστο P(στόχος)

[backtest]
random_runs = 200           # τυχαίες στρατηγικές για σύγκριση (έλεγχος edge)
seed = 42

[server]
host = "127.0.0.1"
port = 8000
